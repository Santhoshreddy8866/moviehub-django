<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP | MovieHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            margin: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: white;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(126,34,206,0.5),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(190,18,60,0.4),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #030712,
                    #111827
                );
        }


        .otp-card {

            width: 100%;
            max-width: 450px;

            padding: 40px;

            border-radius: 28px;

            text-align: center;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(22px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45);
        }


        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 30px;

            background:
                rgba(255,65,108,0.15);

            border:
                1px solid rgba(255,65,108,0.25);
        }


        .title {

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #94a3b8;

            line-height: 1.7;

            margin-bottom: 25px;
        }


        .email {

            color: #fda4af;

            font-weight: 600;

            word-break: break-all;
        }


        .otp-input {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            text-align: center;

            font-size: 27px;

            letter-spacing: 10px;

            color: white;

            outline: none;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.15);

            transition: 0.3s;
        }


        .otp-input:focus {

            border-color: #ff416c;

            box-shadow:
                0 0 0 3px
                rgba(255,65,108,0.12);
        }


        .verify-button {

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #ff1744,
                    #ff416c
                );

            transition: 0.3s;
        }


        .verify-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(255,23,68,0.3);
        }


        .expiry {

            color: #64748b;

            font-size: 13px;

            margin-top: 20px;
        }


        .custom-alert {

            padding: 13px 15px;

            margin-bottom: 20px;

            border-radius: 12px;

            text-align: left;

            font-size: 14px;
        }


        .alert-success-custom {

            color: #bbf7d0;

            background:
                rgba(34,197,94,0.15);

            border:
                1px solid
                rgba(34,197,94,0.30);
        }


        .alert-error-custom {

            color: #fecaca;

            background:
                rgba(239,68,68,0.15);

            border:
                1px solid
                rgba(239,68,68,0.30);
        }


        .back-link {

            display: inline-block;

            margin-top: 20px;

            color: #94a3b8;

            text-decoration: none;
        }


        .back-link:hover {
            color: white;
        }


        @media(max-width:500px) {

            .otp-card {
                padding: 28px 20px;
            }

            .otp-input {
                font-size: 23px;
                letter-spacing: 7px;
            }

        }

    </style>

</head>


<body>


<div class="otp-card">


    <div class="icon">
        ✉
    </div>


    <div class="title">
        Verify OTP
    </div>


    <div class="subtitle">

        We sent a 6-digit verification code to

        <br>

        <span class="email">

            {{ request.user.email }}

        </span>

    </div>



    <!-- MESSAGES -->

    {% for message in messages %}

        {% if message.tags == "success" %}

            <div class="custom-alert alert-success-custom">

                ✅ {{ message }}

            </div>

        {% elif message.tags == "error" %}

            <div class="custom-alert alert-error-custom">

                ❌ {{ message }}

            </div>

        {% endif %}

    {% endfor %}



    <form method="POST">

        {% csrf_token %}


        <input
            type="text"
            name="otp"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            autocomplete="one-time-code"
            class="otp-input"
            placeholder="000000"
            required
            autofocus
        >


        <button
            type="submit"
            class="verify-button"
        >
            Verify & Confirm Booking
        </button>

    </form>



    <div class="expiry">

        OTP is valid for 5 minutes.

    </div>



    <a
        href="{% url 'booking_summary' booking.id %}"
        class="back-link"
    >
        ← Back to Booking
    </a>


</div>


</body>

</html>
