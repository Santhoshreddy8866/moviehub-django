
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MovieHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;

            background:
                radial-gradient(circle at top right, #7e22ce, transparent 35%),
                radial-gradient(circle at bottom left, #be123c, transparent 30%),
                linear-gradient(135deg, #030712, #111827);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
        }

        .glass-box {
            width: 420px;
            padding: 40px;

            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 25px;

            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }

        .form-control {
            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            color: white;

            border-radius: 12px;

            padding: 12px;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.12);

            color: white;

            border-color: #ff416c;

            box-shadow: none;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .main-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ff1744,
                    #ff416c
                );

            color: white;

            font-weight: bold;
        }

        a {
            color: #ff6b8a;
            text-decoration: none;
        }

        .home-link {
            color: #cbd5e1;
        }
    </style>

</head>

<body>

<div class="glass-box">

    <div class="text-center mb-4">

        <h2>
            Welcome Back
        </h2>

        <p class="text-secondary">
            Login to continue booking
        </p>

    </div>


    {% for message in messages %}

        <div class="alert alert-danger">
            {{ message }}
        </div>

    {% endfor %}


    <form method="POST">

        {% csrf_token %}


        <input
            type="hidden"
            name="next"
            value="{{ next|default:'' }}"
        >


        <div class="mb-3">

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Username"
                required
            >

        </div>


        <div class="mb-3">

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Password"
                required
            >

        </div>


        <button
            type="submit"
            class="main-btn"
        >
            Login
        </button>

    </form>


    <p class="text-center mt-4">

        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>

    </p>


    <div class="text-center">

        <a
            href="{% url 'home' %}"
            class="home-link"
        >
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
